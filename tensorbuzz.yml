before_install:
  - sudo mkdir -p /etc/apt/keyrings
  - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | sudo gpg --no-tty --batch --yes --dearmor -o /etc/apt/keyrings/nodesource.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" | sudo tee /etc/apt/sources.list.d/nodesource.list
  - sudo apt-get update
  - sudo apt-get install -y nodejs
environment:
  NODE_ENV: test
builds:
  build_1:
    name: Tests
    dependency_roots:
      - path: .
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "tensorbuzz.yml"
      - "!README.md"
      - "!LICENSE"
    script:
      - npm run test
  build_2:
    name: ESLint, Fallow & Typecheck
    dependency_roots:
      - path: .
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".fallowrc.json"
      - "tensorbuzz.yml"
      - "!README.md"
      - "!LICENSE"
    script:
      - npm run lint
      - npm run fallow:ci
      - npm run typecheck
      - npm run build
